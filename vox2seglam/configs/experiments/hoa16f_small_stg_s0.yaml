# The smallest shipped recipe: 2.7 M parameters. Not a published checkpoint -- it is
# what the tests build a model from, and the cheapest way to try the pipeline end to
# end on a cohort of your own.

name: hoa16f_small_stg_s0
extends: baseline

paths:
  exp_dir: ./experiments/hoa16f_small_stg_s0
model:
  backbone:
    encoder_channels: [8, 16, 32, 64, 128]
    decoder_channels: [64, 32, 16, 8]
  lam:
    graph_channels: [128, 128]
    refine_hidden: 32
repro:
  seed: 0
