# The 39 structures of the Harvard-Oxford Atlas 2.0 label set, which the second
# published model segments (--structures 39). `freesurfer` is the label the same
# structure carries in FreeSurfer's own table, where it has one: the two ventral
# diencephalon halves are a split the protocol introduces and FreeSurfer does not.
#
# The 16 structures the protocol governs are in regions.yaml, numbered differently:
# this file belongs to the other model and the two must not be mixed up.
regions40:
  - {id: 1, short: CWM_L, name: "Left Cerebral White Matter", freesurfer: 2}
  - {id: 2, short: CWM_R, name: "Right Cerebral White Matter", freesurfer: 41}
